name: Frontend API route contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-route-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out backend
        uses: actions/checkout@v4

      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          repository: mazen41/autoreply-frontend
          ref: main
          path: autoreply-frontend

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, xml, curl, zip, gd, bcmath
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Verify frontend API routes exist in Laravel
        run: node scripts/check-frontend-api-routes.mjs ../autoreply-frontend
